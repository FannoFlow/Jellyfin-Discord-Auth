name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read and validate version
        id: meta
        shell: bash
        run: |
          VERSION="$(jq -er '.version | strings' JellyfinDiscordAuth/meta.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version format in meta.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --repo "$REPOSITORY" &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update timestamp in meta.json
        if: steps.check.outputs.skip == 'false'
        run: |
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.timestamp = $ts | .targetAbi = "12.0.0.0"' JellyfinDiscordAuth/meta.json > tmp.json && mv tmp.json JellyfinDiscordAuth/meta.json

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: dotnet build JellyfinDiscordAuth/JellyfinDiscordAuth.csproj --configuration Release

      - name: Package
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p JellyfinDiscordAuth/artifacts
          zip -j JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip \
            JellyfinDiscordAuth/bin/Release/net10.0/JellyfinDiscordAuth.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Core.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Rest.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.WebSocket.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Dave.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Commands.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Interactions.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/Discord.Net.Webhook.dll \
            JellyfinDiscordAuth/bin/Release/net10.0/meta.json

      - name: Compute MD5 checksum
        if: steps.check.outputs.skip == 'false'
        id: checksum
        run: |
          echo "md5=$(md5sum JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip | awk '{print $1}' | tr 'a-f' 'A-F')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.skip == 'false'
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CHANGELOG="$(jq -er '.changelog | strings' JellyfinDiscordAuth/meta.json)"
          gh release create "v$VERSION" \
            --repo "$REPOSITORY" \
            --title "v$VERSION" \
            --notes "$CHANGELOG" \
            JellyfinDiscordAuth/artifacts/JellyfinDiscordAuth.zip

      - name: Update manifest.json
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.md5 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SOURCE_URL="https://github.com/$REPOSITORY/releases/download/v$VERSION/JellyfinDiscordAuth.zip"
          CHANGELOG="$(jq -er '.changelog | strings' JellyfinDiscordAuth/meta.json)"

          NEW_VER="$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg version "$VERSION" \
            --arg checksum "$CHECKSUM" \
            --arg timestamp "$TIMESTAMP" \
            --arg sourceUrl "$SOURCE_URL" \
            '{changelog: $changelog, checksum: $checksum, sourceUrl: $sourceUrl, targetAbi: "12.0.0.0", timestamp: $timestamp, version: $version}')"

          EXISTING="$(jq '.[0].versions' manifest.json)"
          ALL_VERSIONS="$(jq -n --argjson new "$NEW_VER" --argjson existing "$EXISTING" '[$new] + $existing')"
          jq --argjson versions "$ALL_VERSIONS" '.[0].versions = $versions' manifest.json > tmp.json && mv tmp.json manifest.json

      - name: Push manifest branch
        if: steps.check.outputs.skip == 'false'
        id: push_branch
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          BRANCH="ci/manifest-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update manifest for v$VERSION"
          git push origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Create and auto-merge manifest PR
        if: steps.check.outputs.skip == 'false' && steps.push_branch.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          BRANCH="ci/manifest-v$VERSION"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update manifest for v$VERSION" \
            --body "Automated manifest update for release v$VERSION."
          gh pr merge "$BRANCH" --squash --delete-branch 2>/dev/null || \
          gh pr merge "$BRANCH" --auto --squash --delete-branch

      - name: Rollback - delete manifest branch
        if: failure() && steps.push_branch.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: git push origin --delete "ci/manifest-v$VERSION" || true

      - name: Rollback - delete GitHub release and tag
        if: failure() && steps.create_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: gh release delete "v$VERSION" --yes --cleanup-tag
